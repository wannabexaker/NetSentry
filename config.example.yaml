# NetSentry configuration
# Copy to ~/.config/netsentry/config.yaml and edit.
# Secrets (tokens, passwords) live in the encrypted vault — never here.

# ─── Core: how to talk to the router ───
router:
  type: mikrotik
  host: ${vault:ROUTER_HOST}        # e.g. <ROUTER_IP> (resolved from vault)
  user: ${vault:ROUTER_USER}
  ssh_key: ${vault:SSH_KEY}
  ssh_port: 22

# ─── Notification channels ───
notifiers:
  - id: tg
    type: telegram
    token: ${vault:TELEGRAM_TOKEN}
    chat_id: ${vault:TELEGRAM_CHAT_ID}
    # Allowed chat IDs for bot commands (whitelist).
    allowed_chats:
      - "${vault:ALLOWED_CHAT_ID}"
    # How loud unprompted messages are: relaxed | normal | everything.
    #   relaxed     only attacks/outages make a sound; FYI messages are not sent
    #   normal      problems make a sound; reports, recoveries, new devices are silent
    #   everything  every message makes a sound; successful jobs are reported too
    # Changing it in Telegram (/settings → 🔔 Notifications) wins over this
    # until changed again. Replies to your own commands always make a sound.
    notify_mode: normal

# ─── Plugins ───
# Each entry: name + enabled flag + plugin-specific config.
# Disable a plugin by setting enabled: false.
plugins:

  - name: telegram_bot
    enabled: true
    config:
      worker_threads: 4
      # Anti-flood: token bucket per chat (burst capacity, refill per second).
      rate_limit_burst: 8
      rate_limit_per_sec: 0.5
      # Extra commands that need an inline "Yes" tap before running. The risky
      # ones (/rotate, /restart, block, pause) already ask their own question,
      # and a command that does is never asked twice — so this can stay empty.
      confirm_commands: []
      confirm_ttl_s: 120

  - name: router_info
    enabled: true
    config: {}

  - name: pihole_stats
    enabled: true
    config:
      ftl_db_path: /etc/pihole/pihole-FTL.db

  - name: threat_detector
    enabled: true
    config:
      # These set each detector's DEFAULT on/off. At runtime you flip any of them
      # live from Telegram with `/scans <key> on|off` (persisted) — no restart.
      interval_minutes: 10               # how often to scan (SILENT — records only)
      new_domain: false                  # noisy: record every never-seen domain
      ftl_db_path: /etc/pihole/pihole-FTL.db
      # Delivery: report mode. Findings are recorded silently; the report is
      # delivered on this cron AND on demand via /report — no push on detection.
      report_cron: "0 9 * * *"           # daily 09:00 (empty-ish → still on demand)
      immediate_attacks: false           # true = also push attack-severity at once
      dns_window_minutes: 60             # look-back window for DNS analysis
      dns_entropy_bits: 3.6              # per-label entropy to count as "random"
      dns_min_label_len: 20
      dns_min_random_subdomains: 5       # random sub-domains/parent to flag a tunnel
      dns_suspicious_tlds: []            # [] = built-in high-abuse TLD list
      dns_allow_suffixes: []             # extra suppressed domains (any detector)
      dns_allow_defaults: true           # also suppress built-in CDN list (fbcdn.net…)
      max_alert_lines: 15                # digest: max high-severity lines/message
      max_new_domain_examples: 8         # digest: example new domains shown
      arp_checks: true                   # IP/MAC conflict + change detection
      # Opt-in network detectors — each needs a router feature enabled first:
      rogue_dhcp: false                  # requires '/ip dhcp-server alert' on router
      dhcp_allowed_servers: []           # extra allow-listed server MACs (router
                                         # already excludes its own valid-server)
      port_scan: false                   # requires RouterOS `psd` firewall rules
                                         # that tag scanners into a `port-scanners`
                                         # address-list (no log flood)

  - name: speedtest
    enabled: true
    config:
      isp_nominal_mbps: 500

  - name: security_actions
    enabled: true
    config: {}

  - name: guest_wifi_rotator
    enabled: true
    config:
      ssid: Guest                     # SSID name advertised in the QR
      security_profile: guest-visitor # router security profile to update
      password_prefix: guest          # prefix in the diceware password
      rotation_cron: "0 9 * * 1"      # Mondays 09:00 (change live with /rotation)
      diceware_words: 4               # password style
      diceware_digits: 4
      # keep_isolated: true           # devices added with /keep cannot see other WiFi devices

  - name: self_check                  # /health + watchdog: is NetSentry itself running?
    enabled: true
    config:
      interval_minutes: 10            # how often the watchdog re-checks
      confirm_checks: 2               # bad readings in a row before it alerts

  - name: site_watch                  # /sites: are your web apps up? alerts + recovery
    enabled: false
    config:
      interval_minutes: 5
      timeout_s: 10
      fail_after: 2                   # bad readings in a row before alerting
      sites:
        - name: Example app
          url: https://app.example.com/healthz
          fallback_url: https://app.example.com/api/health   # optional: asked when url answers 404
        - name: Example demo
          url: https://demo.example.com/healthz
          paused: true                # listed and checked, never alerts

  - name: menu                        # /menu: every command as buttons
    enabled: true
    config: {}

  - name: settings                    # /settings: move scheduled jobs from Telegram
    enabled: true
    config: {}

  - name: access                      # /access: ssh line, service, paths — how to reach NetSentry
    enabled: true
    config: {}                        # everything is discovered; all keys optional:
    # config:
    #   service: netsentry.service    # the systemd unit shown
    #   ssh_host: pi.example          # shown in the ssh line (default: Tailscale, else LAN address)
    #   repo_url: https://github.com/user/NetSentry   # default: the code folder's git remote

  - name: read_access                 # read-only answers (status/findings/alerts/health) for
    enabled: false                    # another program over a restricted ssh key — set-up:
    config:                           # tools/read-agent/README.md, contract: docs/READ_ACCESS.md
      interval_minutes: 1             # how often the snapshot is rewritten

  - name: power                       # /restart: router / Pi / NetSentry
    enabled: true
    config: {}
    # To also restart the ISP router, feed it through a Shelly plug and replace
    # "config: {}" above with:
    # config:
    #   isp_plug:
    #     host: 192.0.2.50            # the plug's address
    #     off_seconds: 10
    #     via_router_port: 8108       # only if this host cannot reach the plug

  - name: workstation                 # /pc: watch, wake and manage a (gaming / AI) PC
    enabled: false                    # does nothing until host, user and ssh_key are set
    config:                           # set-up from zero: docs/WORKSTATION.md
      name: Gaming PC
      host: 192.0.2.40                # the PC (LAN or Tailscale address)
      user: pcuser
      ssh_key: ~/.ssh/netsentry_pc_ed25519   # restricted to tools/pc-agent on the PC
      port: 22
      mac: AA:BB:CC:DD:EE:FF          # Wake-on-LAN (leave both empty for no Wake button)
      wake_to: 192.0.2.1:9            # a relay (the router forwarding UDP 9) or a broadcast
      services: [lmstudio, hermes, openclaw]   # what NetSentry may start/stop
      wake_and_start: [hermes]        # one tap from a cold PC to a running agent
      links: {}                       # e.g. {hermes: "https://t.me/<your_agent_bot>"}
      remote_keyboard_url: ""         # empty: the remote_keyboard plugin's page, when configured
      gpu_temp_alert_c: 85
      disk_free_alert_gb: 20
      poll_minutes: 5                 # scheduled check; silent while the PC is off
      idle_hours: 0                   # >0: say when it sat idle that long (never auto-sleep)
      wake_wait_minutes: 4
      ai_tunnel_port: 0               # e.g. 11234 with ai: provider: openai (see below)
      ai_remote_port: 1234            # LM Studio's port on the PC

  - name: remote_keyboard             # dashboard "Remote": type and use the mouse on the PC
    enabled: false                    # off unless enabled AND relay_host set; needs HIDway's
    config:                           # relay on this host — set-up: docs/WORKSTATION.md
      relay_host: ""                  # hidwayd's HIDWAY_BIND (this host's Tailscale address)
      relay_port: 47800               # HIDWAY_PORT
      source_host: ""                 # empty = relay_host; add it to HIDWAY_ALLOW_EXTRA
      key: ""                         # ${vault:HIDWAY_KEY} = the 64 hex chars of hidwayd.key
      allow_plaintext: false          # true ONLY for a relay without --key-file
      relay_state_file: /run/hidway/state
      idle_timeout_s: 180             # disarms after this long without input
      rate_limit_per_s: 25
      max_text_chars: 128
      max_mouse_step: 400
      key_interval_ms: 10

  - name: self_backup                 # /snapshot + weekly backup of NetSentry itself
    enabled: true
    config:
      backup_dir: ~/backups/netsentry # must be inside the unit's ReadWritePaths
      cron: "30 3 * * 0"              # Sundays 03:30 (change live with /settings)
      keep: 8
      offsite_weekly: false           # also send a copy WITHOUT the vault key to
                                      # Telegram each week (or use the button)

  - name: locator                     # /where: rough position of every WiFi device
    enabled: true
    config:
      floor: {width_m: 12, height_m: 9}
      # Works without sensors (distance from the router only). For a map, flash
      # three ESP32 boards with firmware/locator-sensor and list them here —
      # see docs/LOCATOR.md:
      # router: {x: 1.0, y: 4.0}
      # sensors:
      #   - {id: s1, name: Living room, host: 192.0.2.61, x: 0.5,  y: 0.5}
      #   - {id: s2, name: Bedroom,     host: 192.0.2.62, x: 11.5, y: 0.5}
      #   - {id: s3, name: Kitchen,     host: 192.0.2.63, x: 6.0,  y: 8.5}

  - name: who_asked                   # /who: which device asks for a domain
    enabled: true
    config:
      lookback_days: 30               # how far back to read Pi-hole
      trace_days: 7                   # a router trace removes itself after this

  - name: health_monitor
    enabled: true
    config:
      interval_minutes: 5
      ping_target: 1.1.1.1
      disk_low_mb: 10
      login_fail_threshold: 1
      login_fail_window_minutes: 5

  - name: traffic_report
    enabled: true
    config:
      interface: eth0
      cron: "0 21 * * *"
      bar_width: 16
      isp_nominal_mbps: 500           # for quota percentages

  - name: channel_scan
    enabled: true
    config:
      cron: "30 4 * * 0"              # Sundays 04:30
      scan_interface: wifi1
      scan_duration_seconds: 10

  - name: config_backup
    enabled: true
    config:
      cron: "0 3 * * 0"               # Sundays 03:00
      backup_dir: ~/backups/router
      retention_days: 30

  - name: morning_briefing
    enabled: true
    config:
      cron: "0 8 * * *"
      overnight_start_hour: 20

  - name: lan_scanner
    enabled: true
    config:
      online_oui_lookup: true     # query api.macvendors.com for vendor names
                                  # (cached locally; set false for fully offline)

  - name: lan_dashboard
    enabled: true
    config:
      bind_host: 127.0.0.1              # bind loopback; expose via `tailscale serve`
      public_host: auto                 # legacy fallback host for the link
      bind_port: 8088
      poll_interval_s: 2.0
      history_samples: 120
      # When set, the Telegram link uses this HTTPS base (TLS terminated by
      # Tailscale Serve). The one-time token in /auth is exchanged for an
      # HttpOnly cookie, so it never stays in the URL. Set up once on the Pi:
      #   tailscale serve --bg --https 443 http://127.0.0.1:8088
      public_base_url: ""               # e.g. https://pihole.<tailnet>.ts.net

  - name: youtube_bookmarks
    enabled: true
    config:
      yt_dlp_bin: yt-dlp                 # apt install yt-dlp  (or pipx)
      max_transcript_chars: 250000       # cap before sending as .txt file
      lang_priority: ["el", "en"]        # subtitle languages, in order
      save_pasted_links: true            # a pasted YouTube link is saved as-is

  - name: github_explorer
    enabled: true
    config:
      base_dir: ~/.local/share/netsentry/repos
      clone_depth: 50                    # shallow clone — saves disk
      max_files_listed: 200              # files listed in the bundle's tree
      max_readme_chars: 12000            # README cap inside the bundle
      bundle_max_inline_file_chars: 4000 # each inlined manifest cap
      offer_pasted_links: true           # a pasted repo link asks "save it?"
      bundle_inline_extras:              # files inlined verbatim in the bundle
        - pyproject.toml
        - package.json
        - Cargo.toml
        - go.mod
        - Makefile
        - Dockerfile
        - docker-compose.yml
        - tsconfig.json
        - requirements.txt

# ─── AI provider ───
# Used by youtube_bookmarks, github_explorer, anything calling self.ai.
# `is_available()` is probed before each call so the bot fails fast when
# your PC is off.
ai:
  provider: ollama
  config:
    host: ${vault:OLLAMA_HOST}     # e.g. <OLLAMA_TAILSCALE_IP>
    port: 11434
    model: gpt-oss:20b             # whatever Ollama serves on that PC
    probe_timeout: 2.0             # seconds for availability check
    request_timeout: 180.0         # generation may take a while
# Any OpenAI-compatible server (LM Studio, vLLM, llama.cpp, OpenAI) instead:
# ai:
#   provider: openai
#   config:
#     base_url: http://127.0.0.1:11234/v1   # LM Studio through the workstation
#                                           # plugin's tunnel (ai_tunnel_port: 11234)
#     model: gpt-oss-20b
#     api_key: ""                  # only if the server wants one (${vault:...})
#     probe_timeout: 3.0
#     request_timeout: 180.0

# ─── Pi-hole integration (optional) ───
# Enables /pi command + morning briefing Pi-hole section.
integrations:
  pihole:
    enabled: true
    ftl_db_path: /etc/pihole/pihole-FTL.db

# ─── Logging ───
logging:
  level: INFO              # DEBUG / INFO / WARNING / ERROR
  file: ~/.local/share/netsentry/netsentry.log
  max_size_mb: 10
  backup_count: 3
