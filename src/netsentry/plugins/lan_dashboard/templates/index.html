{% extends "base.html" %}
{% block title %}NetSentry — Devices{% endblock %}
{% block page %}devices{% endblock %}
{% block head %}
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
  <script defer src="{{ url_for('static', filename='dashboard.js') }}"></script>
{% endblock %}

{% block content %}
<section class="statstrip" aria-label="LAN summary">
  <div class="stat">
    <div class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg> Devices</div>
    <div class="v" id="statDevices">—</div>
  </div>
  <div class="stat is-secure">
    <div class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg> Active now</div>
    <div class="v" id="statActive">—</div>
  </div>
  <div class="stat" id="statUntaggedCard">
    <div class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="10"/></svg> Unnamed</div>
    <div class="v" id="statUntagged">—</div>
  </div>
  <div class="stat">
    <div class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg> Total traffic</div>
    <div class="v" id="statTraffic">—</div>
  </div>
</section>

<div class="toolbar">
  <input id="deviceSearch" class="field grow" type="search" autocomplete="off" placeholder="Search devices by name, MAC, IP…" aria-label="Search devices">
  <select id="netFilter" class="field" aria-label="Show one network">
    <option value="">All networks</option>
  </select>
  <select id="sortMode" class="field" aria-label="Sort devices">
    <option value="unnamed-first" selected>Unnamed first</option>
    <option value="name-asc">Name A→Z</option>
    <option value="network">By network</option>
    <option value="busiest">Busiest now</option>
  </select>
</div>

<section class="device-table" aria-label="LAN devices">
  <div class="table-head" aria-hidden="true">
    <span>Device</span>
    <span>Address</span>
    <span>Traffic</span>
  </div>
  <div id="deviceList" class="device-list"></div>
  <p id="emptyState" class="empty-state">No devices yet.</p>
</section>

<template id="deviceRowTemplate">
  <article class="device-row">
    <div class="traffic-cell">
      <canvas width="60" height="24" aria-hidden="true"></canvas>
    </div>
    <button class="identity-cell tag-toggle" type="button" aria-expanded="false">
      <span class="id-top">
        <span class="id-primary"></span>
        <span class="edit-hint" aria-hidden="true">Edit</span>
      </span>
      <span class="mac"></span>
      <span class="id-chips">
        <span class="unnamed-label">unnamed</span>
        <span class="net-chip" hidden></span>
        <span class="kept-label" title="Keeps its WiFi password when the guest password changes">keeps password</span>
        <span class="retired-label">no longer used</span>
        <span class="blocked-label">blocked</span>
      </span>
    </button>
    <div class="address-cell">
      <span class="ip"></span>
      <span class="hostname"></span>
    </div>
    <div class="rate-cell">
      <span class="tx"><span class="rate-label">tx &uarr;</span> <strong></strong></span>
      <span class="rx"><span class="rate-label">rx &darr;</span> <strong></strong></span>
    </div>
    <div class="activity-cell">
      <span class="activity-badge"></span>
    </div>
    <form class="tag-form">
      <input name="name" type="text" maxlength="80" autocomplete="off" placeholder="Name it — e.g. Kitchen tablet" aria-label="Device name">
      <button class="save-tag" type="submit">Save name</button>
      <button class="retire-tag" type="button">Mark as no longer used</button>
      <button class="block-toggle" type="button">Block</button>
      <button class="keep-toggle" type="button" hidden>Keep password</button>
      <button class="scan-btn" type="button">🔍 Scan ports</button>
      <p class="action-result" role="status" aria-live="polite"></p>
      <div class="scan-out" hidden></div>
    </form>
  </article>
</template>
{% endblock %}
