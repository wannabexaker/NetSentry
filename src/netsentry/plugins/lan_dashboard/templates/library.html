{% extends "base.html" %}
{% block title %}NetSentry — Library{% endblock %}
{% block page %}library{% endblock %}

{% block content %}
<section class="statstrip" aria-label="Library summary">
  <div class="stat">
    <div class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10 8 6 4-6 4V8z"/><rect x="2" y="4" width="20" height="16" rx="3"/></svg> Videos</div>
    <div class="v" id="statVideos">—</div>
  </div>
  <div class="stat">
    <div class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.9a3.4 3.4 0 0 0-1-2.6c3-.3 6-1.5 6-6.5a5 5 0 0 0-1.4-3.5 4.6 4.6 0 0 0-.1-3.5s-1.1-.3-3.5 1.3a12 12 0 0 0-6 0C6.1.7 5 1 5 1a4.6 4.6 0 0 0-.1 3.5A5 5 0 0 0 3.5 8c0 5 3 6.2 6 6.5a3.4 3.4 0 0 0-1 2.6V21"/></svg> Repos</div>
    <div class="v" id="statRepos">—</div>
  </div>
  <div class="stat">
    <div class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> Unwatched</div>
    <div class="v" id="statUnwatched">—</div>
  </div>
  <div class="stat is-secure">
    <div class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> Watched</div>
    <div class="v" id="statWatched">—</div>
  </div>
</section>

<div class="toolbar">
  <input type="search" id="q" class="field grow" placeholder="Search videos & repos…">
</div>

<div class="card">
  <div class="card-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="m10 8 6 4-6 4V8z"/><rect x="2" y="4" width="20" height="16" rx="3"/></svg>
    YouTube <span class="muted small" id="ytCount"></span>
  </div>
  <div id="ytGrid" class="cardgrid"><div class="empty">Loading…</div></div>
</div>

<div class="card">
  <div class="card-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--info)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.9a3.4 3.4 0 0 0-1-2.6c3-.3 6-1.5 6-6.5a5 5 0 0 0-1.4-3.5 4.6 4.6 0 0 0-.1-3.5s-1.1-.3-3.5 1.3a12 12 0 0 0-6 0C6.1.7 5 1 5 1a4.6 4.6 0 0 0-.1 3.5A5 5 0 0 0 3.5 8c0 5 3 6.2 6 6.5a3.4 3.4 0 0 0-1 2.6V21"/></svg>
    GitHub <span class="muted small" id="ghCount"></span>
  </div>
  <div id="ghGrid" class="cardgrid"><div class="empty">Loading…</div></div>
</div>

<template id="icPlay"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></template>
<template id="icRepo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v12"/><circle cx="6" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9v1a5 5 0 0 1-5 5H8"/></svg></template>
{% endblock %}

{% block scripts %}
<script>
const $ = s => document.querySelector(s);
const el = NS.el;
let VIDEOS = [], REPOS = [], loaded = false;

function safeUrl(u){ return /^https?:\/\//i.test(u||"") ? u : "#"; }
function q(){ return $("#q").value.trim().toLowerCase(); }
function icon(id, cls){ const s=el("span","ic "+cls); s.appendChild($("#"+id).content.firstElementChild.cloneNode(true)); return s; }
function tags(meta, arr){ (arr||[]).forEach(t=>{ meta.appendChild(el("span","tag","#"+t)); }); }
function empty(grid, before, cmd, after){
  const box=el("div","empty", before); box.appendChild(el("b",null,cmd)); box.appendChild(document.createTextNode(after));
  grid.replaceChildren(box);
}

function renderYt(){
  const term=q();
  const rows=VIDEOS.filter(v=> !term || ((v.title||"")+" "+(v.channel||"")+" "+(v.tags||[]).join(" ")).toLowerCase().includes(term));
  $("#ytCount").textContent="("+rows.length+")";
  const g=$("#ytGrid"); g.replaceChildren();
  if(!rows.length){ empty(g, "No saved videos yet. Save with ", "/yt <URL>", " in Telegram."); return; }
  rows.forEach(v=>{
    const a=el("a","item"); a.href=safeUrl(v.url); a.target="_blank"; a.rel="noopener noreferrer";
    a.appendChild(icon("icPlay","yt"));
    const body=el("span","body"); body.appendChild(el("span","t",v.title||v.url));
    const m=el("span","m");
    m.appendChild(el("span", v.watched ? "pill pill--secure small" : "pill small", v.watched ? "watched" : "new"));
    m.appendChild(el("span",null,v.channel||"?"));
    if(v.duration && v.duration!=="?") m.appendChild(el("span",null,"· "+v.duration));
    tags(m, v.tags);
    body.appendChild(m); a.appendChild(body); g.appendChild(a);
  });
}

function renderGh(){
  const term=q();
  const rows=REPOS.filter(r=> !term || (r.owner+"/"+r.repo+" "+(r.languages||[]).join(" ")+" "+(r.tags||[]).join(" ")).toLowerCase().includes(term));
  $("#ghCount").textContent="("+rows.length+")";
  const g=$("#ghGrid"); g.replaceChildren();
  if(!rows.length){ empty(g, "No saved repos yet. Save with ", "/gh <owner/repo>", " in Telegram."); return; }
  rows.forEach(r=>{
    const a=el("a","item"); a.href=safeUrl(r.url); a.target="_blank"; a.rel="noopener noreferrer";
    a.appendChild(icon("icRepo","gh"));
    const body=el("span","body"); body.appendChild(el("span","t",r.owner+"/"+r.repo));
    const m=el("span","m");
    const langs=(r.languages||[]).slice(0,3).join(" · ");
    if(langs) m.appendChild(el("span",null,langs));
    if(r.file_count) m.appendChild(el("span",null,"· "+r.file_count+" files"));
    tags(m, r.tags);
    body.appendChild(m); a.appendChild(body); g.appendChild(a);
  });
}

function stats(){
  $("#statVideos").textContent=VIDEOS.length;
  $("#statRepos").textContent=REPOS.length;
  $("#statUnwatched").textContent=VIDEOS.filter(v=>!v.watched).length;   // neutral: not something that needs him
  $("#statWatched").textContent=VIDEOS.filter(v=>v.watched).length;
}

$("#q").addEventListener("input", ()=>{ renderYt(); renderGh(); });

async function load(){
  try { [VIDEOS, REPOS] = await Promise.all([NS.getJSON("/api/library/youtube"), NS.getJSON("/api/library/github")]); }
  catch(e){
    NS.status.offline();
    if(!loaded){ ["#ytGrid","#ghGrid"].forEach(id=>$(id).replaceChildren(el("div","empty","Cannot reach NetSentry — trying again."))); }
    setTimeout(load, 30000);
    return;
  }
  loaded = true;
  NS.status.updated();
  stats(); renderYt(); renderGh();
}
load();
</script>
{% endblock %}
