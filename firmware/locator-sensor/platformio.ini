; NetSentry locator sensor. Build and flash with PlatformIO:
;   pio run -t upload                 (classic ESP32 dev board)
;   pio run -e esp32-c3 -t upload     (ESP32-C3)
[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
